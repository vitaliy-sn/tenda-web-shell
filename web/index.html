<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenda Web Shell</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#111; overflow:hidden; }
  #bar {
    display:flex; align-items:center; gap:10px;
    height:34px; padding:0 12px; box-sizing:border-box;
    background:#1e1e1e; color:#ccc; font:13px/1 monospace;
    border-bottom:1px solid #333; user-select:none;
  }
  #bar .title { font-weight:bold; color:#fff; }
  #dot { width:10px; height:10px; border-radius:50%; background:#e74c3c; display:inline-block; }
  #dot.on { background:#2ecc71; }
  #status { color:#888; }
  #target {
    background:#111; color:#ddd; border:1px solid #444; border-radius:3px;
    padding:3px 6px; font:13px monospace; width:160px; margin-left:auto;
  }
  #target:focus { outline:none; border-color:#2ecc71; }
  #target::placeholder { color:#555; }
  #target:focus::placeholder { color:transparent; }
  #connbtn {
    background:#2c3e50; color:#fff; border:1px solid #444; border-radius:3px;
    padding:4px 12px; font:13px monospace; cursor:pointer;
  }
  #connbtn:hover { background:#34495e; }
  #connbtn.connected { background:#1e6b3a; }
  #clearbtn {
    background:#3a2c2c; color:#fff; border:1px solid #444; border-radius:3px;
    padding:4px 12px; font:13px monospace; cursor:pointer;
  }
  #clearbtn:hover { background:#4d3535; }

  /* Full-viewport layer below the toolbar; centers the shell window. */
  #termwrap {
    position:absolute; top:34px; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
  }

  /* The draggable/resizable "window" around the two panes. Starts centered via
     the flex above; after the first drag/resize it switches to position:absolute
     with explicit left/top so it no longer fights the flex centering. */
  #termwin {
    width:900px; height:520px; min-width:340px; min-height:170px;
    background:#111; border:1px solid #3a3a3a; border-radius:6px;
    box-shadow:0 8px 30px rgba(0,0,0,.55);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #termwin.moved { position:absolute; margin:0; }

  /* Title bar = drag handle. */
  #termtitle {
    height:28px; flex:0 0 28px; padding:0 10px; box-sizing:border-box;
    display:flex; align-items:center;
    background:#1e1e1e; color:#bbb; font:12px/1 monospace;
    border-bottom:1px solid #333; cursor:move; user-select:none;
  }
  #termtitle .grip { margin-right:8px; color:#555; letter-spacing:1px; }

  /* Output pane: scrollable, fills the space above the input row. */
  #output {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    padding:6px 10px; box-sizing:border-box;
    font:14px/1.5 Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    color:#ddd; white-space:pre-wrap; word-break:break-all;
  }
  #output .cmd-line { color:#2ecc71; }
  #output .out-line { color:#ddd; }

  /* Input row: fixed prompt label + text input, always at the bottom. */
  #inputrow {
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:6px 10px; box-sizing:border-box;
    background:#1a1a1a; border-top:1px solid #333;
  }
  #inputrow .prompt { color:#2ecc71; font:14px/1.5 Menlo, Consolas, 'DejaVu Sans Mono', monospace; user-select:none; }
  #cmd {
    flex:1 1 auto; min-width:0; background:transparent; border:none; outline:none;
    color:#fff; font:14px/1.5 Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    caret-color:#2ecc71;
  }

  /* Bottom-right resize grip. */
  #resizehandle {
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; user-select:none; z-index:2;
  }
  #resizehandle::after {
    content:""; position:absolute; right:4px; bottom:4px;
    width:8px; height:8px;
    border-right:2px solid #555; border-bottom:2px solid #555;
  }
</style>
</head>
<body>
<div id="bar">
  <span class="title">tenda-web-shell</span>
  <span id="dot"></span>
  <span id="status">connecting&hellip;</span>
  <input id="target" type="text" placeholder="10.4.1.180" spellcheck="false">
  <button id="connbtn">Connect</button>
  <button id="clearbtn" title="Clear terminal history">Clear</button>
</div>
<div id="termwrap">
  <div id="termwin">
    <div id="termtitle"><span class="grip">&#9635;</span>tenda-web-shell</div>
    <div id="output"></div>
    <div id="inputrow">
      <span class="prompt">$</span>
      <input id="cmd" type="text" spellcheck="false" autocomplete="off" autofocus>
    </div>
    <div id="resizehandle"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var termwrap = document.getElementById("termwrap");
  var win = document.getElementById("termwin");
  var titleBar = document.getElementById("termtitle");
  var resizeHandle = document.getElementById("resizehandle");
  var output = document.getElementById("output");
  var cmdInput = document.getElementById("cmd");

  var dot = document.getElementById("dot");
  var statusEl = document.getElementById("status");
  var targetInput = document.getElementById("target");
  var connBtn = document.getElementById("connbtn");
  var clearBtn = document.getElementById("clearbtn");
  var lastTarget = ""; // address currently applied on the server

  function setStatus(s) {
    if (s === "connected") {
      dot.classList.add("on"); statusEl.textContent = "connected";
      connBtn.textContent = "Disconnect"; connBtn.classList.add("connected");
    } else if (s === "connecting") {
      dot.classList.remove("on"); statusEl.textContent = "connecting\u2026";
      connBtn.textContent = "Connect"; connBtn.classList.remove("connected");
    } else {
      dot.classList.remove("on"); statusEl.textContent = "disconnected";
      connBtn.textContent = "Connect"; connBtn.classList.remove("connected");
    }
  }

  function sendMsg(m) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m));
  }

  connBtn.addEventListener("click", function () {
    var val = targetInput.value.trim();
    if (val === "") {
      // Use the placeholder as the default target when the field is empty.
      val = targetInput.placeholder.trim();
    }
    if (val && val !== lastTarget) {
      sendMsg({ type: "settarget", data: val });
      lastTarget = val;
    }
    if (connBtn.textContent === "Disconnect") {
      sendMsg({ type: "disconnect" });
    } else {
      setStatus("connecting");
      sendMsg({ type: "connect" });
    }
  });

  targetInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") connBtn.click();
  });

  clearBtn.addEventListener("click", function () {
    sendMsg({ type: "clear" });
  });

  // ---- Output pane helpers ----------------------------------------------
  // Keep the output scrolled to the bottom only if the user is already there,
  // so reading history isn't yanked around by new device output.
  function nearBottom() {
    return output.scrollHeight - output.scrollTop - output.clientHeight < 40;
  }

  // Lines starting with "$ " are commands (stored server-side with the prompt
  // prefix); everything else is device output. This keeps commands green both
  // live and after a page refresh (replayed history). The text may contain
  // multiple lines (history replay arrives as one blob), so each line is
  // classified individually.
  function appendLine(text) {
    var wasNear = nearBottom();
    var lines = text.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var div = document.createElement("div");
      div.className = lines[i].indexOf("$ ") === 0 ? "cmd-line" : "out-line";
      div.textContent = lines[i];
      output.appendChild(div);
    }
    if (wasNear) output.scrollTop = output.scrollHeight;
  }

  // ---- Command input -----------------------------------------------------
  // Native <input> handles all editing (backspace, arrows, selection, paste).
  // On Enter: clear the field and send the command. The server stores it in
  // history and echoes it back over WS, so no local echo is needed (and would
  // duplicate the line).
  cmdInput.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var cmd = cmdInput.value;
    cmdInput.value = "";
    if (cmd === "") return;
    sendMsg({ type: "cmd", data: cmd });
  });

  // ---- Window drag + resize --------------------------------------------
  function centerWindow() {
    var wrapRect = termwrap.getBoundingClientRect();
    var w = win.offsetWidth, h = win.offsetHeight;
    var left = Math.max(0, (wrapRect.width - w) / 2);
    var top = Math.max(0, (wrapRect.height - h) / 2);
    win.classList.add("moved");
    win.style.left = left + "px";
    win.style.top = top + "px";
  }

  function startDrag(e) {
    e.preventDefault();
    var wrapRect = termwrap.getBoundingClientRect();
    var winRect = win.getBoundingClientRect();
    var offX = e.clientX - winRect.left;
    var offY = e.clientY - winRect.top;
    win.classList.add("moved");

    function onMove(ev) {
      var x = ev.clientX - offX;
      var y = ev.clientY - offY;
      // Clamp so the window stays inside the wrap area.
      var maxX = Math.max(0, wrapRect.width - win.offsetWidth);
      var maxY = Math.max(0, wrapRect.height - win.offsetHeight);
      x = Math.min(Math.max(0, x), maxX);
      y = Math.min(Math.max(0, y), maxY);
      win.style.left = x + "px";
      win.style.top = y + "px";
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  function startResize(e) {
    e.preventDefault();
    var startW = win.offsetWidth;
    var startH = win.offsetHeight;
    var startX = e.clientX;
    var startY = e.clientY;

    function onMove(ev) {
      var w = Math.max(340, startW + (ev.clientX - startX));
      var h = Math.max(170, startH + (ev.clientY - startY));
      win.style.width = w + "px";
      win.style.height = h + "px";
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  titleBar.addEventListener("mousedown", startDrag);
  resizeHandle.addEventListener("mousedown", startResize);

  // ---- WebSocket --------------------------------------------------------
  var ws;
  function connect() {
    ws = new WebSocket(wsURL());
    ws.onopen = function () { setStatus("connecting"); };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      switch (m.type) {
        case "out":
          appendLine(m.data);
          break;
        case "status":
          setStatus(m.data);
          break;
        case "target":
          targetInput.value = m.data;
          lastTarget = m.data;
          break;
        case "clear":
          output.innerHTML = "";
          cmdInput.value = "";
          break;
      }
    };
    ws.onclose = function () {
      setStatus("disconnected");
      setTimeout(connect, 1500);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function wsURL() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + location.host + "/ws";
  }

  // Initial layout: center the window, focus the input.
  centerWindow();
  cmdInput.focus();
  connect();
})();
</script>
</body>
</html>
